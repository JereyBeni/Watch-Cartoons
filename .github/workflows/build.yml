name: Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Syntax & import check
        run: |
          python -m py_compile main.py youtube_client.py
          python -c "from youtube_client import YouTubeClient; print('Import OK')"

      - name: CLI help smoke test
        run: |
          python main.py --help
          python main.py search --help
          python main.py video --help

  build-exe:
    name: Build Windows Executable
    runs-on: windows-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --name Watch-Cartoons --console main.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Watch-Cartoons-Windows
          path: dist/Watch-Cartoons.exe
          if-no-files-found: error
          retention-days: 30
